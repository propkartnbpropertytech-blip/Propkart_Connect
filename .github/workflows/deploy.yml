name: PropKart Connect CI/CD & Auto-Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy to Hostinger VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Compile Production Bundle (v1.0.0)
        run: npm run build
        env:
          VITE_API_URL: /api/v1

      - name: Verify Distribution Assets
        run: |
          echo "Verifying dist folder content:"
          ls -lh dist/
          test -f dist/index.html || (echo "dist/index.html missing!" && exit 1)

      - name: Deploy Dist to VPS (Native OpenSSH)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USERNAME: ${{ secrets.VPS_USERNAME }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_PASSWORD: ${{ secrets.VPS_SSH_PASSWORD }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          echo ">>> Initiating VPS deployment for PropKart Connect..."
          TARGET_HOST="${VPS_HOST:-200.234.36.120}"
          TARGET_USER="${VPS_USERNAME:-root}"
          TARGET_PORT="${VPS_PORT:-22}"

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          if [ -n "$VPS_SSH_KEY" ]; then
            echo ">>> Configuring dedicated OpenSSH deployment key..."
            printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/deploy_key"
            chmod 600 "$HOME/.ssh/deploy_key"

            {
              echo "Host vps-target"
              echo "  HostName $TARGET_HOST"
              echo "  User $TARGET_USER"
              echo "  Port $TARGET_PORT"
              echo "  IdentityFile $HOME/.ssh/deploy_key"
              echo "  StrictHostKeyChecking no"
              echo "  UserKnownHostsFile /dev/null"
            } > "$HOME/.ssh/config"
            chmod 600 "$HOME/.ssh/config"

            echo ">>> Testing SSH authentication with VPS..."
            ssh vps-target "echo '>>> SSH authentication successful!'"

            echo ">>> Transferring production assets to /root/propconnect-stack/connect-dist..."
            scp -r dist/* vps-target:/root/propconnect-stack/connect-dist/

            echo ">>> Safely restarting propconnect-web container (Zero-Touch)..."
            ssh vps-target "docker restart propconnect-web && docker ps --filter 'name=propconnect-web' --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}' && curl -sI -k https://propconnect.nbpropertytech.com | head -n 5"

          elif [ -n "$VPS_PASSWORD" ]; then
            echo ">>> Configuring SSH password authentication..."
            sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
            export SSHPASS="$VPS_PASSWORD"

            echo ">>> Testing SSH authentication with VPS..."
            sshpass -e ssh -p "$TARGET_PORT" -o StrictHostKeyChecking=no "$TARGET_USER@$TARGET_HOST" "echo '>>> SSH authentication successful!'"

            echo ">>> Transferring production assets to /root/propconnect-stack/connect-dist..."
            sshpass -e scp -P "$TARGET_PORT" -o StrictHostKeyChecking=no -r dist/* "$TARGET_USER@$TARGET_HOST:/root/propconnect-stack/connect-dist/"

            echo ">>> Safely restarting propconnect-web container (Zero-Touch)..."
            sshpass -e ssh -p "$TARGET_PORT" -o StrictHostKeyChecking=no "$TARGET_USER@$TARGET_HOST" "docker restart propconnect-web && docker ps --filter 'name=propconnect-web' --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}' && curl -sI -k https://propconnect.nbpropertytech.com | head -n 5"

          else
            echo "::error::No SSH credentials configured! Please add VPS_SSH_KEY or VPS_SSH_PASSWORD in GitHub Repository Settings -> Secrets and variables -> Actions."
            echo "Refer to repository README.md for the step-by-step secret setup guide."
            exit 1
          fi

          echo ">>> SUCCESS: PropKart Connect deployed to https://propconnect.nbpropertytech.com!"
