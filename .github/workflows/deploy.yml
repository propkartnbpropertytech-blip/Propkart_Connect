name: PropKart Connect CI/CD & Auto-Deploy

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    name: Build & Deploy to Hostinger VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Compile Production Bundle (v1.0.0)
        run: npm run build
        env:
          VITE_API_URL: /api/v1

      - name: Verify Distribution Assets
        run: |
          echo "Verifying dist folder content:"
          ls -lh dist/
          test -f dist/index.html || (echo "dist/index.html missing!" && exit 1)

      - name: Deploy Dist to VPS via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_SSH_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: "dist/*"
          target: "/root/propconnect-stack/connect-dist"
          strip_components: 1
          overwrite: true

      - name: Restart Web Container & Zero-Touch Health Check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_SSH_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            echo ">>> Safely restarting propconnect-web container..."
            docker restart propconnect-web

            echo ">>> Checking propconnect-web container status..."
            docker ps --filter "name=propconnect-web" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

            echo ">>> Running Live HTTPS Health Check..."
            curl -sI -k https://propconnect.nbpropertytech.com | head -n 5

            echo ">>> ZERO-TOUCH CONFIRMATION: Other VPS containers remain untouched."
